name: push-open-report

on:
  schedule:
    # 北京时间 09:25（UTC 01:25），周一~周五，竞价后开盘策略推送
    - cron: '25 1 * * 1-5'
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Push open strategy
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_FALLBACK_API_KEY: ${{ secrets.DEEPSEEK_FALLBACK_API_KEY }}
          LLM_BASE_URL: https://token.sensenova.cn/v1
          LLM_MODEL: deepseek-v4-flash
          LLM_FALLBACK_BASE_URL: https://api.deepseek.com
          LLM_FALLBACK_MODEL: deepseek-chat
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: PYTHONPATH=src python -m daily_review push --type open