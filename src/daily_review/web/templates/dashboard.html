{% extends "base.html" %}
{% block title %}数据看板 · 每日复盘{% endblock %}
{% block content %}
<h1>数据看板</h1>
<div class="panel">
  <div class="row">
    <div><label>交易日</label><input type="text" id="dDate" placeholder="YYYYMMDD"></div>
    <div><label>近 N 个交易日</label><input type="text" id="dDays" value="10"></div>
  </div>
  <div class="muted">打开即加载 KPI + 趋势图表 + 摘要表。有缓存/复盘预写时秒开；轻量采集（仅涨跌停池）冷启动约数十秒。</div>
  <div id="dashLoading" class="muted" style="margin-top:8px;color:var(--accent)">
    加载行情数据…（有缓存时秒开）
  </div>
</div>
<iframe id="frame" title="数据看板" style="display:block;width:100%;min-height:120px;border:1px solid var(--border);border-radius:10px;background:var(--bg)"></iframe>
{% endblock %}

{% block scripts %}
<script>
var frame = document.getElementById('frame');
var loading = document.getElementById('dashLoading');
var loadTimer = null;

function frameSrc(){
  var date = document.getElementById('dDate').value.trim();
  var days = document.getElementById('dDays').value.trim() || '10';
  var q = 'days=' + encodeURIComponent(days);
  if(date){ q += '&date=' + encodeURIComponent(date); }
  return '/api/dashboard/view?' + q;
}
/* 看板与页面融为一体：同源 iframe 测量内容高度，随内容自动撑高，消除内部双滚动条。 */
function fitFrame(){
  try{
    var h = frame.contentWindow.document.documentElement.scrollHeight;
    frame.style.height = (h > 100 ? h : 100) + 'px';
  }catch(e){}
}
window.addEventListener('resize', function(){ fitFrame(); });
function loadDash(){
  loading.style.display = '';
  frame.src = frameSrc();
}
frame.onload = function(){
  loading.style.display = 'none';
  fitFrame();
  setTimeout(fitFrame, 300);
  setTimeout(fitFrame, 800);
};
function scheduleLoad(){
  if(loadTimer){ clearTimeout(loadTimer); }
  loadTimer = setTimeout(function(){ loadDash(); }, 400);
}
document.getElementById('dDate').addEventListener('input', scheduleLoad);
document.getElementById('dDays').addEventListener('input', scheduleLoad);
/* 首屏：优先 ?date= 预填，否则回填最近交易日，就绪后自动加载 */
var preDate = (location.search.match(/[?&]date=(\d{8})/) || [])[1] || '';
if(preDate){
  document.getElementById('dDate').value = preDate;
  loadDash();
}else{
  api('/api/review/recent_date').then(function(d){
    document.getElementById('dDate').value = d.date;
  }).catch(function(){}).finally(function(){ loadDash(); });
}
</script>
{% endblock %}
