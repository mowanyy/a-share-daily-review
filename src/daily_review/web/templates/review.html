{% extends "base.html" %}
{% block title %}跑复盘 · 每日复盘{% endblock %}
{% block content %}
<h1>跑复盘</h1>
<style>
@media (max-width:767px) {
  #result .row > div { display:flex; flex-direction:column; gap:6px; }
  #result .row > div .btn { width:100%; text-align:center; }
}
</style>
<div class="panel">
  <div class="row">
    <div><label>交易日</label><input type="text" id="date" placeholder="YYYYMMDD"></div>
    <div style="flex:2"><label>战法（驱动次日预案）</label><select id="strategy"><option value="">通用预案（不指定战法）</option></select></div>
    <div><label>无 LLM（仅采集+指标）</label><input type="checkbox" id="noLlm" style="width:auto"></div>
  </div>
<div class="row" style="margin-top:12px;gap:8px">
    <button class="btn primary" id="btnReview">开始复盘</button>
    <button class="btn" id="btnPlanTask">隔夜预案</button>
    <button class="btn" id="btnOpenTask">开盘策略</button>
    <button class="btn" id="btnUpdateData">更新数据</button>
    <span class="muted" style="font-size:0.85em">隔夜预案（9:00前）· 开盘策略（9:25-9:30）· 更新数据（刷缓存+重采近N日）</span>
  </div>
  <div class="row" style="margin-top:12px;gap:8px">
    <label style="margin:0">历史报告（已生成的多日复盘档案，重启 Web 后仍在）</label>
    <select id="histDate" class="btn" style="width:auto;padding:6px 10px"><option value="">选择日期…</option></select>
    <button class="btn primary" id="btnHistView">查看</button>
    <span class="muted" style="font-size:0.85em" id="histHint"></span>
  </div>
  <div class="muted" id="hint"></div>
</div>

<div class="panel" id="prog" hidden>
  <div class="row" style="justify-content:space-between">
    <strong id="step"></strong><span class="muted" id="pct"></span>
  </div>
  <div class="progress" style="margin-top:8px"><div id="bar" style="width:0%"></div></div>
  <pre id="logs" hidden></pre>
</div>

<div class="panel" id="result" hidden>
  <div class="row" style="justify-content:space-between">
    <h2 style="margin:0">复盘报告 <span class="muted" id="resultMeta"></span></h2>
    <div>
      <button class="btn primary" id="btnFull">全文</button>
      <button class="btn" id="btnPlan">只看次日预案</button>
      <button class="btn" id="btnDash">查看该日看板</button>
    </div>
  </div>
  <div id="histTypeSwitcher" style="margin-top:8px;display:none"></div>
  <div id="report" style="margin-top:8px"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
var pollTimer = null;
var curJob = '';
var reportHtml = '';
var planHtml = '';
var curDate = '';   /* 当前展示报告的交易日期：btnDash 跳看板用它，而非可编辑的日期输入框 */
var curTask = 'review'; /* review | plan | open */

function loadDate(){
  api('/api/review/recent_date').then(function(d){
    document.getElementById('date').value = d.date;
  }).catch(function(){});
}
function loadStrategies(){
  api('/api/strategies').then(function(d){
    var sel = document.getElementById('strategy');
    var items = (d.strategies || []).slice().sort(function(a,b){
      if(a.status !== b.status) return a.status === 'active' ? -1 : 1;
      return a.name < b.name ? -1 : 1;
    });
    items.forEach(function(s){
      var o = document.createElement('option');
      o.value = s.id;
      o.textContent = (s.status === 'active' ? '[启用] ' : '[草稿] ') + s.name
        + (s.applies_to ? '（' + s.applies_to + '）' : '');
      sel.appendChild(o);
    });
  }).catch(function(){});
}
function startTask(taskType){
  var date = document.getElementById('date').value.trim();
  if(!/^\d{8}$/.test(date)){ alert('交易日需为 YYYYMMDD'); return; }
  var endpoint = taskType === 'review' ? '/api/review/start'
    : taskType === 'plan' ? '/api/plan/start'
    : taskType === 'open' ? '/api/open/start'
    : '/api/data/update';
  var payload = { trade_date: date };
  if(taskType === 'review'){
    payload.strategy_id = document.getElementById('strategy').value;
    payload.no_llm = document.getElementById('noLlm').checked;
  }
  if(taskType === 'data_update'){ payload.days = 6; }
  curTask = taskType;
  disableButtons(true);
  document.getElementById('prog').hidden = false;
  document.getElementById('result').hidden = true;
  document.getElementById('logs').hidden = true;
  document.getElementById('bar').style.width = '0%';
  api(endpoint, {method:'POST', body:JSON.stringify(payload)})
    .then(function(d){ curJob = d.job_id; poll(); })
    .catch(function(e){ alert(e.message); disableButtons(false); });
}
function disableButtons(disabled){
  document.getElementById('btnReview').disabled = disabled;
  document.getElementById('btnPlanTask').disabled = disabled;
  document.getElementById('btnOpenTask').disabled = disabled;
  document.getElementById('btnUpdateData').disabled = disabled;
}
function poll(){
  api('/api/review/status/' + curJob).then(function(j){
    document.getElementById('step').textContent = j.step;
    document.getElementById('pct').textContent = j.progress + '%';
    document.getElementById('bar').style.width = j.progress + '%';
    if(j.logs && j.logs.length){
      var lg = document.getElementById('logs');
      lg.hidden = false;
      lg.textContent = j.logs.join('\n');
    }
    if(j.status === 'done'){ showResult(j); return; }
    if(j.status === 'error'){
      var lg = document.getElementById('logs');
      lg.hidden = false;
      lg.textContent = (j.logs || []).join('\n') + '\n失败：' + j.error;
      disableButtons(false);
      return;
    }
    setTimeout(poll, 1500);
  }).catch(function(e){
    alert(e.message);
    disableButtons(false);
  });
}
function showResult(j){
  reportHtml = j.report_html || '';
  planHtml = j.plan_html || '';
  curDate = j.trade_date || '';
  var taskLabel = j.task_type === 'plan' ? '隔夜预案'
    : j.task_type === 'open' ? '开盘策略'
    : j.task_type === 'data_update' ? '数据更新'
    : '复盘报告';
  document.getElementById('resultMeta').textContent = j.trade_date
    + ' · ' + taskLabel
    + (j.strategy_name ? ' · ' + j.strategy_name : '')
    + (j.no_llm ? ' · 无 LLM' : '');
  if(j.task_type === 'data_update'){
    /* 数据更新：显示日志，无报告 */
    document.getElementById('report').innerHTML = '<pre>' + (j.logs || []).join('\n') + '</pre>';
  } else {
    document.getElementById('report').innerHTML = reportHtml;
  }
  document.getElementById('result').hidden = false;
  document.getElementById('btnFull').classList.add('primary');
  document.getElementById('btnPlan').classList.remove('primary');
  document.getElementById('btnPlan').style.display = (curTask === 'review') ? '' : 'none';
  disableButtons(false);
}
document.getElementById('btnFull').onclick = function(){
  document.getElementById('report').innerHTML = reportHtml;
  this.classList.add('primary');
  document.getElementById('btnPlan').classList.remove('primary');
};
document.getElementById('btnPlan').onclick = function(){
  document.getElementById('report').innerHTML = planHtml
    || '<span class="muted">（该报告不含「七、次日预案」章节）</span>';
  this.classList.add('primary');
  document.getElementById('btnFull').classList.remove('primary');
};
document.getElementById('btnReview').onclick = function(){ startTask('review'); };
document.getElementById('btnPlanTask').onclick = function(){ startTask('plan'); };
document.getElementById('btnOpenTask').onclick = function(){ startTask('open'); };
document.getElementById('btnUpdateData').onclick = function(){ startTask('data_update'); };
document.getElementById('btnDash').onclick = function(){
  /* 用报告完成时的交易日（用户改输入框不影响）；无报告则退回输入框 */
  var d = curDate || document.getElementById('date').value.trim();
  window.location.href = '/dashboard' + (d ? ('?date=' + d) : '');
};
/* 历史报告数据（用于多类型切换） */
var histData = null;  // 当前查看日期的 list_reports 条目

function loadHistory(){
  api('/api/review/history').then(function(d){
    var sel = document.getElementById('histDate');
    var hint = document.getElementById('histHint');
    /* 显示有任一产物的日期（不限于 has_review） */
    var reports = (d.reports || []).filter(function(r){
      return r.has_review || r.has_overnight || r.has_open;
    });
    if(!reports.length){
      hint.textContent = '暂无历史报告（先跑一次复盘/隔夜预案/开盘策略，之后重启 Web 也能查看）';
      return;
    }
    sel.innerHTML = '<option value="">选择日期…</option>' + reports.map(function(r){
      var extra = [];
      if(r.has_review) extra.push('复盘');
      if(r.has_overnight) extra.push('隔夜');
      if(r.has_open) extra.push('开盘');
      if(r.has_dashboard) extra.push('看板');
      return '<option value="' + esc(r.date) + '"'
        + ' data-has-review="' + (r.has_review ? '1' : '0') + '"'
        + ' data-has-overnight="' + (r.has_overnight ? '1' : '0') + '"'
        + ' data-has-open="' + (r.has_open ? '1' : '0') + '"'
        + '>' + r.date + (extra.length ? '（' + extra.join('/') + '）' : '') + '</option>';
    }).join('');
    hint.textContent = '共 ' + reports.length + ' 天历史，选日期后点「查看」';
  }).catch(function(){});
}
function viewHistory(){
  var sel = document.getElementById('histDate');
  var d = sel.value;
  if(!d){ return; }
  /* 确定最佳类型：review > plan > open */
  var opt = sel.options[sel.selectedIndex];
  var hasReview = opt && opt.dataset.hasReview === '1';
  var hasOvernight = opt && opt.dataset.hasOvernight === '1';
  var hasOpen = opt && opt.dataset.hasOpen === '1';
  var type = hasReview ? 'review' : hasOvernight ? 'plan' : 'open';
  /* 加载历史 */
  api('/api/review/history/' + d + '?type=' + type).then(function(j){
    curTask = j.task_type || 'review';
    showResult(j);
    document.getElementById('resultMeta').textContent = j.trade_date + ' · 历史'
      + (j.task_type === 'plan' ? '隔夜预案'
        : j.task_type === 'open' ? '开盘策略'
        : '复盘');
    /* 多类型切换按钮 */
    var typeBtns = [];
    if(hasReview) typeBtns.push({t: 'review', label: '复盘'});
    if(hasOvernight) typeBtns.push({t: 'plan', label: '隔夜预案'});
    if(hasOpen) typeBtns.push({t: 'open', label: '开盘策略'});
    var typeDiv = document.getElementById('histTypeSwitcher');
    if(typeBtns.length > 1){
      typeDiv.innerHTML = typeBtns.map(function(item){
        var active = item.t === curTask ? ' primary' : '';
        return '<button class="btn' + active + '" data-type="' + item.t + '">' + item.label + '</button>';
      }).join('');
      typeDiv.style.display = 'block';
      /* 绑定切换事件 */
      typeDiv.querySelectorAll('button').forEach(function(btn){
        btn.onclick = function(){
          switchHistType(this.dataset.type);
        };
      });
    } else {
      typeDiv.style.display = 'none';
    }
  }).catch(function(e){ alert(e.message); });
}
function switchHistType(type){
  var d = document.getElementById('histDate').value;
  if(!d) return;
  api('/api/review/history/' + d + '?type=' + type).then(function(j){
    curTask = j.task_type || type;
    showResult(j);
    document.getElementById('resultMeta').textContent = j.trade_date + ' · 历史'
      + (j.task_type === 'plan' ? '隔夜预案'
        : j.task_type === 'open' ? '开盘策略'
        : '复盘');
    /* 更新按钮高亮 */
    var typeDiv = document.getElementById('histTypeSwitcher');
    typeDiv.querySelectorAll('button').forEach(function(btn){
      btn.classList.toggle('primary', btn.dataset.type === type);
    });
  }).catch(function(e){ alert(e.message); });
}
document.getElementById('btnHistView').onclick = viewHistory;
loadDate();
loadStrategies();
loadHistory();
</script>
{% endblock %}
