[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-review"
version = "0.4.0"
description = "A股超短连板收盘复盘系统：连板梯队 / 题材周期 / 炸板资金 / 龙虎榜游资 / AI复盘与次日预案"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# 后续迭代启用：
# llm   = ["anthropic"]
dev = ["pytest"]

[project.scripts]
daily-review = "daily_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
