[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-review"
version = "0.23.0"
description = "A股超短连板收盘复盘系统：情绪温度 / 连板梯队 / 题材周期 / 炸板资金 / 龙虎榜游资 / AI复盘 / RAG问答 / Web工作台 / 多模型协作 / 复盘三时段 / 概念池 / 数据本地化 / 战法↔Skill桥 / 基金风格skill档案"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "flask>=3.0",
]

[project.optional-dependencies]
# 向量检索增强（可选）：bge-small-zh 本地 embedding，缺失时自动降级纯关键词
kb = [
    "sentence-transformers",
    "modelscope",
]
dev = ["pytest"]

[project.scripts]
daily-review = "daily_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
